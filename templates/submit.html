  
<!DOCTYPE html>
<html>
<head>
     <title>JobShield | Fake Job Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <div class="brand">
    <img src="{{ url_for('static', filename='images/jobshield.png') }}"
         alt="JobShield Logo">

        <h1>Fake Job Advertisement Detector</h1>

        <p style="text-align:center;">
            Protect yourself from fraudulent job advertisements.
        </p>

        <h2>Analyze a Job Advertisement</h2>

         <form method="POST" action="/analyze" class="analysis-form">
            <label>Job Title:</label>
            <input type="text" name="job_title"
                   placeholder="Enter job title" required>

            <label>Company Name:</label>
            <input type="text" name="company_name"
                   placeholder="Enter company name" required>

            <label>Job Advertisement:</label>
            <textarea name="job_text" rows="8"
                      maxlength="5000"
                      placeholder="Paste job advertisement here..."
                      required></textarea>

            <button type="submit">
                Analyze Advertisement
            </button>

        </form>
